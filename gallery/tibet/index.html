      // Coming back from a painting: hand its view-transition name to the same work on the wall,

      addEventListener('pagereveal', (e) => {
        const from = e.viewTransition && window.navigation?.activation?.from?.url;
        if (!from || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        for (const img of document.querySelectorAll('.work img')) img.style.viewTransitionName = '';
        const img = document.querySelector(`.work[data-href="${new URL(from).pathname}"] img`);
        if (!img) return;
        img.style.viewTransitionName = 'artwork';
        e.viewTransition.finished.finally(() => (img.style.viewTransitionName = ''));
      });

alog"><button class="close">Close</button></form></dialog><script data-copied="Link copied">
    (() => {
      const copied = document.currentScript.dataset.copied;
      const art = document.querySelector('.plate img');
      const viewer = document.getElementById('viewer');
      const big = viewer.querySelector('img');
      const status = document.getElementById('status');

      // Instagram's ig.me links only work in the app, so phones get them and desktops the profile.
      const ask = document.querySelector('.ask');
      if (ask.dataset.mobile && matchMedia('(pointer: coarse)').matches) ask.href = ask.dataset.mobile;

      // Full size: the lazy image in the closed dialog loads only when it opens; until then the
      // image already on screen stands in for it.
      document.querySelector('.zoom').addEventListener('click', (e) => {
        const r = art.getBoundingClientRect();
        const fx = e.detail ? (e.clientX - r.left) / r.width : 0.5;
        const fy = e.detail ? (e.clientY - r.top) / r.height : 0.5;
        big.style.background = `url("${art.currentSrc}") 0 0 / 100% 100%`;
        const w = big.width;
        big.style.width = `${Math.min(w, Math.max(innerWidth * 1.75, w / devicePixelRatio))}px`;
        viewer.showModal();
        viewer.scrollTo(fx * viewer.scrollWidth - innerWidth / 2, fy * viewer.scrollHeight - innerHeight / 2);
      });

      // A mouse drags the canvas around; a click without dragging puts it back.
      let drag = null;
      viewer.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && !e.target.closest('button')) drag = { x: e.clientX, y: e.clientY, moved: false };
      });
      viewer.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        drag.moved ||= Math.abs(dx) + Math.abs(dy) > 3;
        viewer.scrollBy(-dx, -dy);
        drag.x = e.clientX;
        drag.y = e.clientY;
      });
      viewer.addEventListener('pointerup', () => {
        if (drag && !drag.moved) viewer.close();
        drag = null;
      });

      addEventListener('keydown', (e) => {
        if (viewer.open || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
        document.querySelector(`.pager [data-key="${e.key}"]`)?.click();
      });

      const share = document.querySelector('.share');
      const shareLabel = share.textContent;
      share.addEventListener('click', async () => {
        if (navigator.share) return navigator.share({ title: document.title, url: location.href }).catch(() => {});
        await navigator.clipboard?.writeText(location.href);
        status.textContent = share.textContent = copied;
        setTimeout(() => (share.textContent = shareLabel), 2000);
      });

      // Back to the wall returns to the exact place and filters, when the wall is in this tab's history.
      const back = document.querySelector('[data-back]');
      back.addEventListener('click', (e) => {
        const nav = window.navigation;
        const entries = nav?.entries?.() ?? [];
        for (let k = (nav?.currentEntry?.index ?? 0) - 1; k >= 0; k--) {
          if (entries[k].url && new URL(entries[k].url).pathname === back.pathname) {
            e.preventDefault();
            nav.traverseTo(entries[k].key);
            return;
          }
        }
        if (!nav && document.referrer && new URL(document.referrer).pathname === back.pathname) {
          e.preventDefault();
          history.back();
        }
      });
    })();
